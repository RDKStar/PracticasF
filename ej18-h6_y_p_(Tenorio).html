<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formatos</title>
    <style>
        h6, p {
            color: #ff0000; font-family: Arial, sans-serif; font-size: 24px;
        }
    </style>
</head>
<body>
    <p>Este es un párrafo de ejemplo para demostrar el uso de estilos en HTML. Los estilos se definen en la cabecera del documento y se aplican a los elementos correspondientes.</p>
    <h6>Created by: Arturo Tenorio</h6>
</body>
</html>
